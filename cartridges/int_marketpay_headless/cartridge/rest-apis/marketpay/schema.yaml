schema.yaml:
openapi: 3.0.0
info:
  version: 1.0.1
  title: MarketPay Custom APIs
components:
  securitySchemes:
    ShopperToken:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://my-shortcode.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/my-org-id/oauth2/authorize
          tokenUrl: https://my-shortcode.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/my-org-id/oauth2/token
          scopes:
            c_checkoutsession_rw: Create and return session and token
            c_paymentstatus_rw: Retrieve payment status for a customer session
        clientCredentials:
          tokenUrl: https://my-shortcode.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/my-org-id/oauth2/token
          scopes:
            c_checkoutsession_rw: Create and return session and token
            c_paymentstatus_rw: Retrieve payment status for a customer session
    AmOAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://account.demandware.com/dwsso/oauth2/access_token
          scopes:
            c_marketpaycallbacks_rw: MarketPay custom SCAPI permisssion
paths:
  /checkoutsession:
    post:
      summary: Create the Auth Token and Session ID
      operationId: createCheckoutSession
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: c_customerId
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: locale
          required: false
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
                - configuration
                - callbacks
              properties:
                order:
                  type: object
                  required:
                    - orderId
                    - amount
                  properties:
                    orderId:
                      type: string
                      minLength: 1
                    amount:
                      type: object
                      required:
                        - value
                        - currency
                      properties:
                        value:
                          type: number
                          minimum: 0
                        currency:
                          type: string
                          minLength: 3
                          maxLength: 3
                    orderLines:
                      type: array
                      items:
                        type: object
                        properties:
                          itemId:
                            type: string
                          description:
                            type: string
                          quantity:
                            type: integer
                            minimum: 1
                          unitPrice:
                            type: number
                          taxAmount:
                            type: number
                          goodsType:
                            type: string
                    customer:
                      type: object
                      properties:
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: string
                        billingAddress:
                          type: object
                          properties:
                            street:
                              type: string
                            city:
                              type: string
                            country:
                              type: string
                              minLength: 2
                              maxLength: 2
                            zipCode:
                              type: string
                        shippingAddress:
                          type: object
                          properties:
                            street:
                              type: string
                            city:
                              type: string
                            country:
                              type: string
                              minLength: 2
                              maxLength: 2
                            zipCode:
                              type: string
                    transactionInfo:
                      type: object
                callbacks:
                  type: object
                configuration:
                  type: object
                  required:
                    - paymentType
                  properties:
                    paymentType:
                      type: string
                      minLength: 1                    
                    autoCapture:
                      type: boolean
                    paymentDisplayType:
                      type: string
                    country:
                      type: string
                      minLength: 2
                      maxLength: 2
                    language:
                      type: string
                      minLength: 2
      security:
        - ShopperToken: ["c_checkoutsession_rw"]
      responses:
        "200":
          description: Returns created Auth Token and Session ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  length:
                    type: number
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        token:
                          type: string
                        sessionId:
                          type: string
        "404":
          description: Returns general errors
          content:
            application/json:
              examples:
                not_found:
                  value:
                    {
                      "type": "page not found",
                    }
  /paymentstatus:
    post:
      summary: Retrieve the payment status for a customer's active MarketPay session
      operationId: paymentStatus
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1        
        - in: query
          name: c_orderId
          required: true
          schema:
            type: string
            minLength: 1
      security:
        - ShopperToken: ["c_paymentstatus_rw"]
      responses:
        "200":
          description: Returns the payment status for the customer's active session
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Session not found or status retrieval failed
          content:
            application/json:
              examples:
                not_found:
                  value:
                    {
                      "type": "session not found",
                    }
  /payment-notification:
    post:
      summary: Receive an asynchronous payment notification from MarketPay for a placed order
      operationId: paymentNotification
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_orderid
                - status
              properties:
                shop_orderid:
                  type: string
                  minLength: 1
                transaction_id:
                  type: string
                status:
                  type: string
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                amount:
                  type: number
                xml:
                  type: string
                error_message:
                  type: string
                error_code:
                  type: string
                merchant_error_message:
                  type: string
                credit_card_token:
                  type: string
                nature:
                  type: string
                payment_status:
                  type: string
                type:
                  type: string
                blacklist_token:
                  type: string
                fraud_explanation:
                  type: string
                fraud_recommendation:
                  type: string
                fraud_risk_score:
                  type: string
                require_capture:
                  type: string
                masked_credit_card:
                  type: string
                payment_id:
                  type: string
                checksum:
                  type: string
                cardholder_message_must_be_shown:
                  type: string
      security:
        - AmOAuth2: [c_marketpaycallbacks_rw]
      responses:
        "200":
          description: Notification acknowledged
          content:
            application/json:
              examples:
                acknowledged:
                  value:
                    {
                      "message": "Acknowledged",
                    }
        "400":
          description: Invalid notification payload or order not found
          content:
            application/json:
              examples:
                order_not_found:
                  value:
                    {
                      "type": "order not found",
                    }
  /payment-success:
    post:
      summary: Receive a payment success callback from MarketPay and finalize the order
      operationId: paymentSuccess
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_orderid
                - status
              properties:
                shop_orderid:
                  type: string
                  minLength: 1
                transaction_id:
                  type: string
                status:
                  type: string
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                amount:
                  type: number
                xml:
                  type: string
                error_message:
                  type: string
                error_code:
                  type: string
                merchant_error_message:
                  type: string
                credit_card_token:
                  type: string
                nature:
                  type: string
                payment_status:
                  type: string
                type:
                  type: string
                blacklist_token:
                  type: string
                fraud_explanation:
                  type: string
                fraud_recommendation:
                  type: string
                fraud_risk_score:
                  type: string
                require_capture:
                  type: string
                masked_credit_card:
                  type: string
                payment_id:
                  type: string
                checksum:
                  type: string
                cardholder_message_must_be_shown:
                  type: string
      security:
        - AmOAuth2: [c_marketpaycallbacks_rw]
      responses:
        "200":
          description: Payment finalized; returns the URL to redirect the shopper to
          content:
            application/json:
              examples:
                acknowledged:
                  value:
                    {
                      "redirectUrl": "https://example.com/success?orderID=00000101&isApp=false",
                    }
        "400":
          description: Invalid payload or order not found
          content:
            application/json:
              examples:
                order_not_found:
                  value:
                    {
                      "type": "order not found",
                    }
  /payment-failed:
    post:
      summary: Receive a payment failure callback from MarketPay for a placed order
      operationId: paymentFailed
      parameters:
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_orderid
              properties:
                shop_orderid:
                  type: string
                  minLength: 1
      security:
        - AmOAuth2: [c_marketpaycallbacks_rw]
      responses:
        "200":
          description: Failure acknowledged; returns the URL to redirect the shopper to
          content:
            application/json:
              examples:
                acknowledged:
                  value:
                    {
                      "redirectUrl": "https://example.com/failed?orderID=00000101&isApp=false",
                    }
        "400":
          description: Invalid payload
          content:
            application/json:
              examples:
                invalid_payload:
                  value:
                    {
                      "type": "shop_orderid missing from payload.",
                    }
